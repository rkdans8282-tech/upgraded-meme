name: LockMemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # CI에서는 TEAM_ID로 덮어씀
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LockMemo:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lockmemo
    entitlements:
      path: App/LockMemo.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.lockmemo]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 락메모
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [lockmemo]
    dependencies:
      - target: LockMemoWidget
  LockMemoWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lockmemo.widget
    entitlements:
      path: Widget/LockMemoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.lockmemo]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 락메모 위젯
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
