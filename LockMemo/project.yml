name: LockMemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # Xcode에서 본인 Team 선택
targets:
  LockMemo:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/LockMemo.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.lockmemo]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 락메모
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [lockmemo]
    dependencies:
      - target: LockMemoWidget
  LockMemoWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/LockMemoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.lockmemo]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 락메모 위젯
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
